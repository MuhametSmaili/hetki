name: Release on Tag

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate pushed release tag
        if: github.event_name == 'push'
        run: ./scripts/validate-release-tag.sh "${GITHUB_REF_NAME}"

      - name: Set up exact Go version
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run pinned lint gate
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m --build-tags=integration

      - name: Lint shell with pinned ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          version: v0.11.0

      - name: Verify source gates
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy -diff
          go mod verify
          go build ./...
          go test ./...
          go test -race ./...
          go vet ./...
          command -v tmux
          go vet -tags=integration ./internal/backend/tmux ./internal/app/start ./internal/app/tui
          go test -tags=integration ./internal/backend/tmux ./internal/app/start ./internal/app/tui
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.9
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
          bash -n install.sh scripts/*.sh
          ./scripts/validate-release-tag.sh --self-test
          ./scripts/test-install.sh

      - name: Install exact GoReleaser version
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.0
          install-only: true

      - name: Build every release artifact twice
        env:
          HETKI_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./scripts/test-release-reproducibility.sh

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: |
            dist/hetki-darwin-amd64
            dist/hetki-darwin-arm64
            dist/hetki-linux-amd64
            dist/hetki-linux-arm64
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 1

  native-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Go version
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Smoke-test native artifact and install paths
        shell: bash
        run: |
          case "${RUNNER_OS}/${RUNNER_ARCH}" in
            Linux/X64) artifact=dist/hetki-linux-amd64 ;;
            Linux/ARM64) artifact=dist/hetki-linux-arm64 ;;
            macOS/X64) artifact=dist/hetki-darwin-amd64 ;;
            macOS/ARM64) artifact=dist/hetki-darwin-arm64 ;;
            *) echo "unsupported runner ${RUNNER_OS}/${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          install -m 0755 "$artifact" "$RUNNER_TEMP/hetki"
          output="$("$RUNNER_TEMP/hetki" --version)"
          grep -Fx "commit: ${GITHUB_SHA}" <<<"$output"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]; then
            grep -Fx "hetki version ${GITHUB_REF_NAME}" <<<"$output"
          fi
          ./scripts/test-install.sh

  attest:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - build
      - native-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Attest release checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/checksums.txt

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download attested release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Publish immutable tag artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          flags=(--verify-tag --title "${GITHUB_REF_NAME}" --generate-notes)
          [[ "${GITHUB_REF_NAME}" == *-* ]] && flags+=(--prerelease)
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            dist/hetki-darwin-amd64 \
            dist/hetki-darwin-arm64 \
            dist/hetki-linux-amd64 \
            dist/hetki-linux-arm64 \
            dist/checksums.txt \
            "${flags[@]}"

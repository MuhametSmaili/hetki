name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - README.md
  push:
    branches:
      - main
    paths-ignore:
      - README.md

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Go version
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify formatting and modules
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy -diff
          go mod verify

      - name: Build and vet
        run: |
          go build ./...
          go vet ./...

      - name: Run unit and race tests
        run: |
          go test -shuffle=on ./...
          go test -race -shuffle=on ./...

      - name: Run installer harness
        run: |
          bash -n install.sh scripts/*.sh
          ./scripts/validate-release-tag.sh --self-test
          ./scripts/test-install.sh

  integration:
    name: Integration (${{ matrix.os }}, tmux ${{ matrix.tmux }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tmux: 3.2a
          - os: ubuntu-latest
            tmux: '3.8'
          - os: macos-latest
            tmux: '3.8'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Go version
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install tmux build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y build-essential libevent-dev libncurses-dev pkg-config bison python3

      - name: Install tmux build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # tmux 3.8 requires Unicode and allocator libraries on macOS.
          brew install libevent ncurses utf8proc jemalloc pkgconf bison
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$(brew --prefix libevent)/lib/pkgconfig:$(brew --prefix ncurses)/lib/pkgconfig:$(brew --prefix utf8proc)/lib/pkgconfig:$(brew --prefix jemalloc)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build pinned tmux protocol families
        shell: bash
        env:
          TMUX_VERSION: ${{ matrix.tmux }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/hetki-tmux"
          mkdir -p "$work"
          while read -r version checksum; do
            archive="$work/tmux-$version.tar.gz"
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
              --output "$archive" "https://github.com/tmux/tmux/releases/download/$version/tmux-$version.tar.gz"
            printf '%s  %s\n' "$checksum" "$archive" | shasum -a 256 -c -
            tar -xzf "$archive" -C "$work"
            (
              cd "$work/tmux-$version"
              ./configure
              make -j2
            ) </dev/null
            test "$("$work/tmux-$version/tmux" -V)" = "tmux $version"
          done <<'SOURCES'
          3.2a 551553a4f82beaa8dadc9256800bcc284d7c000081e47aa6ecbb6ff36eacd05f
          3.8 e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
          SOURCES
          echo "$work/tmux-$TMUX_VERSION" >> "$GITHUB_PATH"
          echo "HETKI_TEST_TMUX_LEGACY=$work/tmux-3.2a/tmux" >> "$GITHUB_ENV"
          echo "HETKI_TEST_TMUX_CURRENT=$work/tmux-3.8/tmux" >> "$GITHUB_ENV"

      - name: Run the shared native and PTY integration gate
        run: |
          node --version
          cc --version
          make check-integration

  security-and-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Go version
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run pinned lint gate
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .golangci-lint-version
          args: --timeout=5m --build-tags=integration

      - name: Verify formatting with pinned golangci-lint
        run: golangci-lint fmt --diff

      - name: Validate workflows with pinned actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.9

      - name: Lint shell with pinned ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          version: v0.11.0

      - name: Scan reachable vulnerabilities with pinned govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  release-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Go version
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install exact GoReleaser version
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.0
          install-only: true

      - name: Prove release artifacts are reproducible
        run: ./scripts/test-release-reproducibility.sh

name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - README.md
  push:
    branches:
      - main
    paths-ignore:
      - README.md

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Go version
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify formatting and modules
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy -diff
          go mod verify

      - name: Build and vet
        run: |
          go build ./...
          go vet ./...

      - name: Run unit and race tests
        run: |
          go test ./...
          go test -race ./...

      - name: Run isolated tmux integration tests with race detection
        if: runner.os == 'Linux'
        run: |
          command -v tmux
          go vet -tags=integration ./internal/backend/tmux ./internal/app/start ./internal/app/tui ./internal/app/statusobserver
          go test -race -tags=integration ./internal/backend/tmux ./internal/app/start ./internal/app/tui ./internal/app/statusobserver

      - name: Run installer harness
        run: |
          bash -n install.sh scripts/*.sh
          ./scripts/validate-release-tag.sh --self-test
          ./scripts/test-install.sh

  security-and-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Go version
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run pinned lint gate
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m --build-tags=integration

      - name: Validate workflows with pinned actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.9

      - name: Lint shell with pinned ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          version: v0.11.0

      - name: Scan reachable vulnerabilities with pinned govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  release-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Go version
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install exact GoReleaser version
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.0
          install-only: true

      - name: Prove release artifacts are reproducible
        run: ./scripts/test-release-reproducibility.sh

version: "2"

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocognit

    # Error handling.
    - errcheck
    - errorlint

    # Bug classes.
    - gocritic
    - asasalint
    - bidichk
    - bodyclose
    - copyloopvar
    - durationcheck
    - exhaustive
    - forcetypeassert
    - misspell
    - nilnesserr
    - reassign
    - unconvert
    - usestdlibvars

    # Modern Go idioms.
    - modernize

    # API and naming hygiene.
    - goprintffuncname
    - musttag
    - predeclared
    - unparam

    # Tests and loops.
    - fatcontext
    - intrange
    - makezero
    - testifylint
    - thelper
    - tparallel
    - usetesting
    - wastedassign

    # Whitespace.
    - whitespace

    - nolintlint
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    gocognit:
      min-complexity: 15
    gocritic:
      # The stable default checks plus badLock.
      enabled-checks:
        - badLock
    govet:
      enable:
        - nilness
        - unusedwrite
    nolintlint:
      require-explanation: true
      require-specific: true
    thelper:
      tb:
        name: false
  exclusions:
    warn-unused: true
    presets:
      # Close, Flush, print and os.*env results.
      - std-error-handling
    rules:
      # These files use table-driven step closures that take *testing.T but are
      # not helpers. Marking them with t.Helper() would hide the assertion line.
      - path: '(internal/app/statusobserver/protocol_lifecycle_test|internal/app/tui/open_test|internal/state/sessions_test|internal/status/daemon/(executable|inspection|runtime)_test|internal/status/service/outcome_test|internal/tui/menu_update_test)\.go'
        linters:
          - thelper
      # Tests assert on concrete result types; an unchecked assertion there is
      # deliberate and cannot panic a user-facing process.
      - path: '_test\.go'
        linters:
          - forcetypeassert

issues:
  # Report every finding; the defaults truncate output to 3 identical issues
  # and 50 per linter.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports

version: "2"

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocognit

    # Error handling.
    - errcheck
    - errorlint

    # Bug classes with no current findings.
    - gocritic
    - asasalint
    - bidichk
    - bodyclose
    - copyloopvar
    - durationcheck
    - misspell
    - nilnesserr
    - reassign
    - unconvert
    - usestdlibvars

    # Tests and loops.
    - fatcontext
    - intrange
    - makezero
    - testifylint
    - usetesting
    - wastedassign

    - nolintlint
  settings:
    gocognit:
      min-complexity: 15
    gocritic:
      disable-all: true
      enabled-checks:
        - argOrder
        - badCall
        - badCond
        - badLock
        - caseOrder
        - dupArg
        - dupCase
        - exitAfterDefer
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    warn-unused: true
    presets:
      # Close, Flush, print and os.*env results.
      - std-error-handling
    rules:
      # Test HTTP handlers: a failed write fails the client side of the test.
      - path: _test\.go
        linters: [errcheck]
        text: "`w.Write`"
